name: jetson-voice

services:
  voice:
    image: ghcr.io/${GITHUB_REPOSITORY:-youruser/jetson-voice}:latest
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - models:/models
      - ./configs/config.docker.yml:/config/config.yml:ro
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - PIPER_VOICE=${PIPER_VOICE:-en_US-ryan-medium}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "/opt/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  models:
    name: jetson-voice-models
