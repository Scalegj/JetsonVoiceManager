[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jetson-voice"
version = "2.0.0"
description = "AI voice companion for Jetson Orin Nano"
requires-python = ">=3.10"
dependencies = [
    "wyoming>=1.5.0",
    "pyaudio>=0.2.14",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
    # WebRTC gateway
    "aiortc>=1.9.0",
    "aiohttp-cors>=0.7.0",
    # Debug mode
    "jiwer>=3.0.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
jetson-voice = "jetson_voice.main:main"

[tool.setuptools.packages.find]
where = ["src"]
