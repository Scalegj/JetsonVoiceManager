[DEFAULT]
# Jetson IP address (required)
jetson_ip = 10.0.0.40

# Ollama model to use
ollama_model = llama3.2

# Piper TTS voice model (optional - leave commented to use default)
# Example: piper_voice = en_US-amy-medium
piper_voice = en_US-ryan-medium

enable_interrupt = true

# Audio settings
silence_threshold = 500.0
silence_duration = 1.5

# Uncomment and customize if you want a different system prompt
# system_prompt = You are a helpful AI assistant.
interrupt_debug = true


# Set to true to enable streaming by default
streaming = true
